---
name: Security - Dependencies

on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        default: '.'
        description: 'Working directory for scans'
      fail-on-severity:
        type: string
        default: 'moderate'
        description: 'Minimum severity to fail (low, moderate, high, critical)'
      enable-license-check:
        type: boolean
        default: true
        description: 'Enable license compliance checking'
      allowed-licenses:
        type: string
        default: 'Apache-2.0,BSD-2-Clause,BSD-3-Clause,ISC,MIT,0BSD,CC0-1.0'
        description: 'Comma-separated list of allowed licenses'
      denied-licenses:
        type: string
        default: 'GPL-2.0,GPL-3.0,AGPL-3.0'
        description: 'Comma-separated list of denied licenses'
      fail-on-license-violation:
        type: boolean
        default: false
        description: 'Fail workflow on license violations'

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  dependency-review:
    name: Dependency Review (GitHub)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.repository.visibility == 'public'
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: ${{ inputs.fail-on-severity }}
          allow-licenses: ${{ inputs.allowed-licenses }}
          license-check: ${{ inputs.enable-license-check }}
          vulnerability-check: true
          comment-summary-in-pr: true

  go-audit:
    name: Audit Go
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # A job-level `if: hashFiles('go.mod') != ''` cannot gate this job:
      # job conditions are evaluated before any checkout, so hashFiles sees an
      # empty workspace and would skip the audit in Go repos too. Detection has
      # to happen after checkout, and every Go step keys off this output.
      - name: Detect Go module
        id: detect-go
        working-directory: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          if [ -f go.mod ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No go.mod found, skipping Go audit"
          fi

      - name: Setup Go
        if: steps.detect-go.outputs.present == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.working-directory }}/go.mod
          cache: true

      - name: Run govulncheck
        if: steps.detect-go.outputs.present == 'true'
        working-directory: ${{ inputs.working-directory }}
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck -json ./... | tee govulncheck.json

          if [ -s govulncheck.json ]; then
            echo "::warning::Vulnerabilities detected by govulncheck"
            jq -r '.message // empty' govulncheck.json | head -10
          else
            echo "::notice::No vulnerabilities found"
          fi

      - name: Check Go licenses
        if: steps.detect-go.outputs.present == 'true' && inputs.enable-license-check
        working-directory: ${{ inputs.working-directory }}
        env:
          ALLOWED_LICENSES: ${{ inputs.allowed-licenses }}
        run: |
          # Values arrive via env: and are read as shell variables, not
          # substituted into the body by the workflow parser — a caller value
          # containing $(...) stays a license list instead of becoming code.
          go install github.com/google/go-licenses@latest
          echo "Checking Go dependency licenses..."
          go-licenses check ./... --allowed_licenses="$ALLOWED_LICENSES" 2>&1 | tee go-licenses.txt || true
          go-licenses csv ./... > go-licenses.csv 2>&1 || true

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-audit-results
          path: |
            ${{ inputs.working-directory }}/govulncheck.json
            ${{ inputs.working-directory }}/go-licenses.txt
            ${{ inputs.working-directory }}/go-licenses.csv
          retention-days: 30
          if-no-files-found: ignore

  security-report:
    name: Create Report
    runs-on: ubuntu-latest
    needs: [dependency-review, go-audit]
    if: always() && !cancelled()
    steps:
      - name: Generate Security Report
        env:
          LICENSE_CHECK: ${{ inputs.enable-license-check && 'Enabled' || 'Disabled' }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          GO_AUDIT_RESULT: ${{ needs.go-audit.result }}
          ALLOWED_LICENSES: ${{ inputs.allowed-licenses }}
          DENIED_LICENSES: ${{ inputs.denied-licenses }}
          FAIL_ON_LICENSE_VIOLATION: ${{ inputs.fail-on-license-violation }}
        run: |
          set -euo pipefail
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')

          # Values arrive via env: and are substituted by printf, not by the
          # shell parsing the body — a value containing $(...) is written
          # literally instead of being executed by the runner. The backticks in
          # the format strings are literal Markdown, hence single quotes.
          {
            printf '# Dependencies & License Compliance Report\n\n'
            printf '**Timestamp:** %s\n' "$TIMESTAMP"
            printf '**License Check:** %s\n\n' "$LICENSE_CHECK"
            printf '## Scan Results\n\n'
            printf '| Component | Status |\n|-----------|--------|\n'
            printf '| Dependency Review | %s |\n' "$DEPENDENCY_REVIEW_RESULT"
            printf '| Go Audit | %s |\n\n' "$GO_AUDIT_RESULT"
            printf '## Tools Used\n\n'
            printf -- '- **govulncheck**: Official Go vulnerability scanner\n'
            printf -- '- **go-licenses**: Google license compliance tool\n'
            printf -- '- **GitHub Dependency Review**: Native GitHub PR dependency analysis\n\n'
            printf '## License Configuration\n\n'
            # shellcheck disable=SC2016  # backticks are literal Markdown here
            printf '**Allowed Licenses:** `%s`\n' "$ALLOWED_LICENSES"
            # shellcheck disable=SC2016  # backticks are literal Markdown here
            printf '**Denied Licenses:** `%s`\n' "$DENIED_LICENSES"
            printf '**Fail on Violation:** %s\n\n' "$FAIL_ON_LICENSE_VIOLATION"
            printf -- '---\n'
            printf '*Dependency security and license compliance analysis completed*\n'
          } >> "$GITHUB_STEP_SUMMARY"
