---
name: CI - Go

on:
  workflow_call:
    inputs:
      go_version:
        description: 'Go version (or "file" to read from go.mod)'
        required: false
        type: string
        default: 'file'
      enable_test:
        description: 'Enable Go tests'
        required: false
        type: boolean
        default: true
      enable_golangci_lint:
        description: 'Enable golangci-lint'
        required: false
        type: boolean
        default: true
      enable_staticcheck:
        description: 'Enable staticcheck'
        required: false
        type: boolean
        default: true
      cancel-in-progress:
        description: |
          Whether to cancel in-progress runs in the same concurrency group.
          Default matches this workflow's intended semantics; override only
          for matrix or fan-out invocations that need different semantics
          than the single-call default.
        required: false
        type: boolean
        default: true
      concurrency-suffix:
        description: |
          Optional suffix appended to the concurrency group as `-<suffix>`.
          Empty default preserves the original group name; set to separate
          parallel invocations of this reusable from the same caller (e.g.
          per-matrix-leg or per-mode).
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  # Static `ci-go-` discriminator: inside a `workflow_call` reusable
  # `github.workflow`/`github.ref` resolve to the *caller*, so without it two
  # different reusables invoked from the same caller (e.g. this + security-secrets)
  # would share a group and cancel each other. `concurrency-suffix` further
  # separates parallel invocations of this same reusable.
  group: >-
    ci-go-${{ github.workflow }}-${{ github.ref }}${{
      inputs.concurrency-suffix != '' && format('-{0}', inputs.concurrency-suffix) || ''
    }}
  cancel-in-progress: ${{ inputs.cancel-in-progress }}

jobs:
  test:
    name: Go Test
    runs-on: ubuntu-latest
    if: ${{ inputs.enable_test }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Go (from file)
        if: ${{ inputs.go_version == 'file' }}
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Go (specific version)
        if: ${{ inputs.go_version != 'file' }}
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6
        with:
          go-version: ${{ inputs.go_version }}
          cache: true

      - name: Download and verify dependencies
        run: |
          go mod download
          go mod verify

      - name: Run go vet
        run: go vet ./...

      - name: Check formatting
        run: |
          # Scope to first-party package dirs: `go list ./...` excludes vendor/
          # and out-of-module code, so the gate never fails on third-party or
          # generated files the consumer can't reformat. Pipe dirs to gofmt via
          # xargs (one path per line) instead of unquoted word-splitting.
          UNFORMATTED=$(go list -f '{{.Dir}}' ./... | xargs gofmt -s -l)
          if [ -n "$UNFORMATTED" ]; then
            echo "::error::The following files are not formatted:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Run staticcheck
        if: ${{ inputs.enable_staticcheck }}
        uses: dominikh/staticcheck-action@9716614d4101e79b4340dd97b10e54d68234e431 # v1.4.1
        with:
          # renovate: datasource=github-releases depName=dominikh/go-tools
          version: '2025.1.1'
          install-go: false

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Generate coverage report
        run: |
          go tool cover -html=coverage.out -o coverage.html
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}')
          echo "Test coverage: $COVERAGE"

      - name: Upload coverage artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: coverage-report
          path: coverage.html
          retention-days: 7

  golangci-lint:
    name: Go Lint
    runs-on: ubuntu-latest
    if: ${{ inputs.enable_golangci_lint }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Go (from file)
        if: ${{ inputs.go_version == 'file' }}
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Go (specific version)
        if: ${{ inputs.go_version != 'file' }}
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6
        with:
          go-version: ${{ inputs.go_version }}
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9
        with:
          version: latest
