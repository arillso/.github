---
name: Pull Request

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  # This repository ships workflows and configuration rather than application
  # code, so the gate is lint plus code scanning. Each job calls this repo's own
  # reusable via a local `./` path: the workflows consumers depend on are the
  # same ones exercised here, and a break shows up before it reaches them.
  lint:
    name: Lint
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/ci-lint.yml
    with:
      enable_actionlint: true
      # The embedded `run:` scripts in these workflows are only checked when
      # shellcheck runs alongside actionlint.
      enable_shellcheck: true
      # Runs against the repo's own `.yamllint.yml`, which extends
      # templates/.yamllint.yml and raises line-length to 600 — the only
      # override. It exists for the 515-char `--allowedTools` line in
      # `ai-claude-review.yml`, which is comma-separated and cannot be folded:
      # YAML block folding inserts a space after each newline, corrupting the
      # tool names. The org template keeps its 500-char limit.
      enable_yamllint: true

  review:
    name: Code Review
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    uses: ./.github/workflows/ai-claude-review.yml
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  code-scan:
    name: Code Analysis
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: ./.github/workflows/security-code.yml
    with:
      languages: '["actions"]'

  # `AGENTS.md` requires every new workflow to be documented in
  # `.github/workflows/README.md`, but nothing enforced it, so the two drifted.
  # The check is bidirectional: a reusable without a section, and a section
  # without a file, both fail. Scope is the reusables only — the README is
  # titled "Reusable Workflows", and this repo's own CI workflows are not
  # something a consumer can call, so `workflow_call` is the discriminator
  # rather than a hardcoded ignore list.
  #
  # The `**Jobs:**` assertion covers a second drift: the list was present in
  # some sections and absent in others, because "only one job" read as a reason
  # to omit it. `AGENTS.md` now requires the list unconditionally, so a missing
  # one is a failure rather than a judgement call.
  readme-sync:
    name: Workflow README Sync
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Assert README documents every reusable workflow, and only those
        run: |
          set -euo pipefail
          README=.github/workflows/README.md
          errors=0
          for f in .github/workflows/*.yml; do
            name=$(basename "$f")
            grep -q '^ *workflow_call:' "$f" || continue
            grep -qF "#### \`${name}\`" "$README" || {
              echo "::error file=$README::missing section for $name"
              errors=1
            }
            # Scoped to the one section: start at its `####` heading, stop at
            # the next `####`/`###`/`##` so a neighbour's list cannot satisfy
            # this section. The verdict is a flag rather than an in-rule
            # `exit 0`, because `exit` still runs `END`, whose status would
            # overwrite it.
            awk -v want="#### \`${name}\`" '
              $0 == want { inside = 1; next }
              inside && /^#{2,4} / { inside = 0 }
              inside && /^\*\*Jobs:\*\*/ { found = 1; exit }
              END { exit found ? 0 : 1 }
            ' "$README" || {
              echo "::error file=$README::section for $name has no **Jobs:** list"
              errors=1
            }
          done
          # `< <(...)` rather than a pipe: a piped `while` runs in a subshell,
          # where the `errors=1` assignment is discarded and every phantom
          # section would pass unnoticed.
          # shellcheck disable=SC2016  # `\K` below is PCRE, not a shell expansion.
          while read -r name; do
            test -e ".github/workflows/$name" || {
              echo "::error file=$README::section for $name has no such workflow"
              errors=1
            }
          done < <(grep -oP '^#### `\K[^`]+\.yml(?=`$)' "$README")
          exit $errors

  # `ci-ansible-molecule.yml` pipes the molecule output through `tee` so the
  # failure text survives in the job summary and an artifact. Two ways that can
  # break silently: dropping `set -o pipefail` makes every red run report green,
  # and dropping `2>&1` leaves the file without the very text it exists for.
  # This replicates the shell form against a command that is guaranteed to fail.
  pipefail-guard:
    name: Pipefail Guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Assert exit code and stderr survive the tee pipe
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/guard.log"
          # The subshell carries its own `set` so the outer `set -e` does not
          # abort before the assertions run; `|| rc=$?` captures the status.
          rc=0
          (
            # A subshell inherits `pipefail` from the step body, so this `set`
            # is belt-and-braces rather than the thing under test: the guard
            # fails only when the option is absent from both.
            set -euo pipefail
            sh -c 'echo molecule-failure-text >&2; exit 2' 2>&1 | tee "$LOG"
          ) || rc=$?
          if [ "$rc" -ne 2 ]; then
            echo "::error::exit code masked by the pipe (got $rc, want 2)"
            exit 1
          fi
          if ! grep -q molecule-failure-text "$LOG"; then
            echo "::error::stderr missing from the captured log"
            exit 1
          fi
          echo "GUARD-PASS"

      - name: Assert a crashed scanner survives the tee pipe
        run: |
          set -euo pipefail
          # `security-deps.yml` (govulncheck) and `security-config.yml`
          # (kubesec) both pipe a scanner through `tee` to keep the report as
          # an artifact. Without `pipefail` the pipe reports the exit code of
          # `tee`, so a scanner that never ran leaves a green job behind.
          REPORT="$RUNNER_TEMP/scanner.json"
          rc=0
          (
            set -euo pipefail
            sh -c 'echo "{\"config\":{}}"; exit 2' | tee "$REPORT"
          ) || rc=$?
          if [ "$rc" -ne 2 ]; then
            echo "::error::scanner exit code masked by the pipe (got $rc, want 2)"
            exit 1
          fi
          # The crashed scanner still wrote a header frame, which is why a
          # file-size check cannot stand in for a real result check.
          if [ ! -s "$REPORT" ]; then
            echo "::error::expected the crashed scanner to still write output"
            exit 1
          fi
          echo "GUARD-PASS"

      - name: Assert a broken report fails the jq check
        run: |
          set -euo pipefail
          # The kubesec step used to read `jq ... 2>/dev/null || echo "0"`,
          # turning an unparsable report into "no critical findings". The
          # count must come from real JSON or the step must fail.
          REPORT="$RUNNER_TEMP/broken.json"
          printf 'not json\n' > "$REPORT"
          rc=0
          jq '[.[] | select(.scoring.critical > 0)] | length' "$REPORT" >/dev/null 2>&1 || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "::error::jq accepted a broken report instead of failing"
            exit 1
          fi
          echo "GUARD-PASS"

  # A `${{ inputs.* }}` reference in a `run:` body is substituted before the
  # shell parses the line, so a caller-supplied value would be shell source on
  # the runner rather than an argument. The guard asserts structurally that no
  # reusable workflow here does that, and that no heredoc delimiter is left
  # unquoted — an unquoted body expands a substituted value the same way.
  workflow-input-injection:
    name: Workflow Input Injection Guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The guard derives its set from the parsed `on:` mapping rather than
      # grepping for the bare token, because `workflow_call` also appears in
      # prose comments — hence a YAML parser rather than a plain shell scan.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14.7'
      - name: Install pyyaml
        run: python3 -m pip install --disable-pip-version-check pyyaml
      - name: Assert caller inputs reach shell bodies through env
        run: scripts/tests/test-workflow-input-injection.sh

  # The `.rst` customManager in renovate-base.json rewrites SHA-pinned actions
  # inside documentation examples, where placeholder SHAs and deliberate
  # counter-examples sit in the same file and must stay untouched. No
  # `renovate-config-validator` runs here, so a loosened regex would otherwise
  # first surface as a Renovate pull request rewriting a "wrong" example into a
  # right one. Only `jq` and `grep -P` are needed, both present on the runner.
  renovate-rst-manager:
    name: Renovate .rst Manager Guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Assert the .rst manager spares placeholder and mutable refs
        run: scripts/tests/test-renovate-rst-manager.sh
