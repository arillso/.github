---
name: CI - Ansible Collection

on:
  workflow_call:
    inputs:
      collection_namespace:
        description: 'Collection namespace (e.g., arillso)'
        required: false
        type: string
        default: 'arillso'
      collection_name:
        description: 'Collection name (e.g., system)'
        required: true
        type: string
      python_version:
        description: 'Python version for linting'
        required: false
        type: string
        default: '3.11'
      ansible_versions:
        description: 'JSON array of Ansible versions to test'
        required: false
        type: string
        default: '["stable-2.18", "stable-2.19", "stable-2.20"]'
      enable_argument_specs_check:
        description: 'Enable argument specs validation for roles'
        required: false
        type: boolean
        default: true
      enable_integration_tests:
        description: 'Enable integration tests'
        required: false
        type: boolean
        default: false
      enable_unit_tests:
        description: 'Enable unit tests'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  security-events: write

jobs:
  ansible-lint:
    name: Ansible Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ inputs.python_version }}
          cache: "pip"

      - name: Install ansible-lint
        run: pip install ansible-lint ansible-core

      - name: Run ansible-lint
        run: ansible-lint --force-color

  yaml-lint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install yamllint
        run: pip install yamllint

      - name: Run yamllint
        run: yamllint .

  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ inputs.python_version }}
          cache: "pip"

      - name: Install linting tools
        run: |
          pip install ruff pylint black isort
          pip install ansible-core

      - name: Run ruff
        run: ruff check plugins/ --output-format=github
        continue-on-error: true

      - name: Run black (check only)
        run: black --check --diff plugins/
        continue-on-error: true

      - name: Run isort (check only)
        run: isort --check-only --diff plugins/
        continue-on-error: true

      - name: Run pylint
        run: pylint plugins/**/*.py
        continue-on-error: true

  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@07035fd053f7be764496c0f8d8f9f41f98305101 # v22
        with:
          globs: "**/*.md"
        continue-on-error: true

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
        continue-on-error: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@0d579ffd059c29b07949a3cce3983f0780820c98 # v4
        with:
          sarif_file: "trivy-results.sarif"
        if: always()
        continue-on-error: true

  sanity-test:
    name: Sanity Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ansible-version: ${{ fromJson(inputs.ansible_versions) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          path: ansible_collections/${{ inputs.collection_namespace }}/${{ inputs.collection_name }}

      - name: Determine Python version
        id: python_version
        run: |
          ANSIBLE_VER="${{ matrix.ansible-version }}"
          if [[ "$ANSIBLE_VER" == "devel" ]]; then
            echo "version=3.12" >> $GITHUB_OUTPUT
          elif [[ "$ANSIBLE_VER" =~ ^stable-([0-9]+)\.([0-9]+)$ ]]; then
            MINOR="${BASH_REMATCH[2]}"
            if [[ "$MINOR" -ge 20 ]]; then
              echo "version=3.12" >> $GITHUB_OUTPUT
            else
              echo "version=${{ inputs.python_version }}" >> $GITHUB_OUTPUT
            fi
          else
            echo "version=${{ inputs.python_version }}" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ steps.python_version.outputs.version }}

      - name: Install Ansible
        run: pip install https://github.com/ansible/ansible/archive/${{ matrix.ansible-version }}.tar.gz --disable-pip-version-check

      - name: Install collection dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
        working-directory: ansible_collections/${{ inputs.collection_namespace }}/${{ inputs.collection_name }}

      - name: Run sanity tests
        run: ansible-test sanity --docker --color --python ${{ steps.python_version.outputs.version }}
        working-directory: ansible_collections/${{ inputs.collection_namespace }}/${{ inputs.collection_name }}

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    if: ${{ inputs.enable_unit_tests }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          path: ansible_collections/${{ inputs.collection_namespace }}/${{ inputs.collection_name }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install Ansible
        run: pip install ansible-core

      - name: Run unit tests
        run: ansible-test units --docker --color
        working-directory: ansible_collections/${{ inputs.collection_namespace }}/${{ inputs.collection_name }}

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    if: ${{ inputs.enable_integration_tests }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          path: ansible_collections/${{ inputs.collection_namespace }}/${{ inputs.collection_name }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install Ansible
        run: pip install ansible-core

      - name: Run integration tests
        run: ansible-test integration --docker --color
        working-directory: ansible_collections/${{ inputs.collection_namespace }}/${{ inputs.collection_name }}

  argument-specs:
    name: Argument Specs Check
    runs-on: ubuntu-latest
    if: ${{ inputs.enable_argument_specs_check }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Checkout check-argument-specs action
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: arillso/.github
          path: .github-actions
          sparse-checkout: actions/check-argument-specs

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ inputs.python_version }}

      - name: Check argument specs
        uses: ./.github-actions/actions/check-argument-specs

  build:
    name: Build Collection
    runs-on: ubuntu-latest
    needs: [ansible-lint, yaml-lint, python-lint, sanity-test]
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install Ansible
        run: pip install ansible-core

      - name: Build collection
        run: ansible-galaxy collection build

      - name: Upload collection artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: collection
          path: "*.tar.gz"
          retention-days: 7
