---
name: CI - Ansible Collection

on:
  workflow_call:
    inputs:
      collection_namespace:
        description: 'Collection namespace (e.g., arillso)'
        required: false
        type: string
        default: 'arillso'
      collection_name:
        description: 'Collection name (e.g., system)'
        required: true
        type: string
      python_version:
        description: 'Python version for linting'
        required: false
        type: string
        default: '3.11'
      ansible_versions:
        description: 'JSON array of Ansible versions to test'
        required: false
        type: string
        default: '["stable-2.18", "stable-2.19", "stable-2.20"]'
      enable_argument_specs_check:
        description: 'Enable argument specs validation for roles'
        required: false
        type: boolean
        default: true
      enable_integration_tests:
        description: 'Enable integration tests'
        required: false
        type: boolean
        default: false
      enable_unit_tests:
        description: 'Enable unit tests'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  security-events: write

jobs:
  ansible-lint:
    name: Ansible Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ inputs.python_version }}
          cache: "pip"

      - name: Install ansible-lint
        run: pip install ansible-lint ansible-core

      - name: Run ansible-lint
        run: ansible-lint --force-color

  yaml-lint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install yamllint
        run: pip install yamllint

      - name: Run yamllint
        run: yamllint .

  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ inputs.python_version }}
          cache: "pip"

      - name: Install linting tools
        run: |
          pip install ruff pylint black isort
          pip install ansible-core

      - name: Run ruff
        run: ruff check plugins/ --output-format=github
        continue-on-error: true

      - name: Run black (check only)
        run: black --check --diff plugins/
        continue-on-error: true

      - name: Run isort (check only)
        run: isort --check-only --diff plugins/
        continue-on-error: true

      - name: Run pylint
        run: pylint plugins/**/*.py
        continue-on-error: true

  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24
        with:
          globs: "**/*.md"
        continue-on-error: true

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
        continue-on-error: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          sarif_file: "trivy-results.sarif"
        if: always()
        continue-on-error: true

  sanity-test:
    name: Sanity Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ansible-version: ${{ fromJson(inputs.ansible_versions) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: ansible_collections/${{ inputs.collection_namespace }}/${{ inputs.collection_name }}

      - name: Determine Python version
        id: python_version
        env:
          ANSIBLE_VER: ${{ matrix.ansible-version }}
          PYTHON_VERSION: ${{ inputs.python_version }}
        run: |
          set -euo pipefail
          # Values arrive via env: and are read as shell variables, not
          # substituted into the body by the workflow parser. The value also
          # travels through $GITHUB_OUTPUT into setup-python, so it is pinned
          # to a version shape before it is written out.
          if [[ ! "$PYTHON_VERSION" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "::error::python_version must be a version like 3.12, got: $PYTHON_VERSION"
            exit 1
          fi

          # The controller Python is a property of the ansible-core *branch*,
          # not of the caller: `ansible-test sanity --python X` rejects any X
          # outside that branch's CONTROLLER_PYTHON_VERSIONS. So the sanity job
          # derives it here and ignores inputs.python_version for known
          # branches; the input still drives the seven lint/build jobs.
          #
          # Each value is the *maximum* of the branch's tuple, so sanity runs on
          # the newest interpreter the branch accepts — the one closest to what
          # release-ansible-collection.yml builds the artifact on (.python-version).
          # Tuples read from ansible/ansible:<branch>
          # test/lib/ansible_test/_util/target/common/constants.py, 2026-08-17:
          #   stable-2.18  3.11 3.12 3.13
          #   stable-2.19  3.11 3.12 3.13
          #   stable-2.20  3.12 3.13 3.14
          #   devel        3.13 3.14 3.15
          # devel is capped at 3.14 rather than its maximum 3.15: 3.15 is
          # unreleased and setup-python has no build for it.
          #
          # An unknown branch keeps the caller's value — validated above. The
          # table is asserted by scripts/tests/test-controller-python-matrix.sh,
          # because this job never runs in this repository: a wrong value here
          # turns every consumer collection red at once instead of failing here.
          case "$ANSIBLE_VER" in
            stable-2.18) echo "version=3.13" >> "$GITHUB_OUTPUT" ;;
            stable-2.19) echo "version=3.13" >> "$GITHUB_OUTPUT" ;;
            stable-2.20) echo "version=3.14" >> "$GITHUB_OUTPUT" ;;
            devel) echo "version=3.14" >> "$GITHUB_OUTPUT" ;;
            *) echo "version=$PYTHON_VERSION" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ steps.python_version.outputs.version }}

      - name: Install Ansible
        run: pip install https://github.com/ansible/ansible/archive/${{ matrix.ansible-version }}.tar.gz --disable-pip-version-check

      - name: Install collection dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
        working-directory: ansible_collections/${{ inputs.collection_namespace }}/${{ inputs.collection_name }}

      - name: Run sanity tests
        run: ansible-test sanity --docker --color --python ${{ steps.python_version.outputs.version }}
        working-directory: ansible_collections/${{ inputs.collection_namespace }}/${{ inputs.collection_name }}

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    if: ${{ inputs.enable_unit_tests }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: ansible_collections/${{ inputs.collection_namespace }}/${{ inputs.collection_name }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install Ansible
        run: pip install ansible-core

      - name: Run unit tests
        run: ansible-test units --docker --color
        working-directory: ansible_collections/${{ inputs.collection_namespace }}/${{ inputs.collection_name }}

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    if: ${{ inputs.enable_integration_tests }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: ansible_collections/${{ inputs.collection_namespace }}/${{ inputs.collection_name }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install Ansible
        run: pip install ansible-core

      - name: Run integration tests
        run: ansible-test integration --docker --color
        working-directory: ansible_collections/${{ inputs.collection_namespace }}/${{ inputs.collection_name }}

  argument-specs:
    name: Argument Specs Check
    runs-on: ubuntu-latest
    if: ${{ inputs.enable_argument_specs_check }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Checkout check-argument-specs action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: arillso/.github
          path: .github-actions
          sparse-checkout: actions/check-argument-specs

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ inputs.python_version }}

      - name: Check argument specs
        uses: ./.github-actions/actions/check-argument-specs

  build:
    name: Build Collection
    runs-on: ubuntu-latest
    needs: [ansible-lint, yaml-lint, python-lint, sanity-test]
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install Ansible
        run: pip install ansible-core

      - name: Build collection
        run: ansible-galaxy collection build

      - name: Upload collection artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: collection
          path: "*.tar.gz"
          retention-days: 7
