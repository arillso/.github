---
name: Release - Ansible Collection

on:
  workflow_call:
    inputs:
      collection_namespace:
        description: 'Collection namespace (e.g., arillso)'
        required: false
        type: string
        default: 'arillso'
      collection_name:
        description: 'Collection name (e.g., system)'
        required: true
        type: string
      python_version:
        description: >-
          Python version to use. When empty, the workflow reads the repo-root
          .python-version file, falling back to 3.11 if that is absent too.
        required: false
        type: string
        default: ''
    secrets:
      galaxy_api_key:
        description: 'Ansible Galaxy API key'
        required: true

permissions:
  contents: write

jobs:
  publish:
    name: Publish to Ansible Galaxy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Validate tag against galaxy.yml
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          if [ ! -f "galaxy.yml" ]; then
            echo "::error::galaxy.yml not found"
            exit 1
          fi
          # Top-level 'version:' only, surrounding quotes and comments dropped.
          GALAXY_VERSION="$(sed -n -E "s/^version:[[:space:]]*['\"]?([^'\"#[:space:]]*).*/\1/p" galaxy.yml | head -n1)"
          if [ -z "$GALAXY_VERSION" ]; then
            echo "::error file=galaxy.yml::No version key in galaxy.yml"
            exit 1
          fi
          if [ "$VERSION" != "$GALAXY_VERSION" ]; then
            echo "::error file=galaxy.yml::Tag '$VERSION' does not match galaxy.yml version '$GALAXY_VERSION'"
            exit 1
          fi

      - name: Extract changelog for version
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          # The tag value reaches the shell via env:, never via workflow
          # expression interpolation into the script body. awk -v and index()
          # keep it out of pattern text, so regex metacharacters stay literal.
          if [ ! -f "CHANGELOG.md" ]; then
            echo "::error::CHANGELOG.md not found"
            exit 1
          fi
          # Body between '## [VERSION]...' (or '## VERSION ...') and the next
          # '## ' heading or the trailing link reference definitions. Prefix
          # match, same rule as templates/workflows/tag.yml, so date suffixes
          # and linked headings ('## [1.0.0](url)') still match.
          awk -v v="$VERSION" '
            { sub(/\r$/, "") }
            /^## / {
              if (found) exit
              if (index($0, "## [" v "]") == 1 || $0 == "## " v || index($0, "## " v " ") == 1) { found = 1; next }
            }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md > /tmp/changelog.txt
          if ! grep -q '[^[:space:]]' /tmp/changelog.txt; then
            echo "::error file=CHANGELOG.md::No or empty '## [$VERSION]' section in CHANGELOG.md"
            exit 1
          fi

      - name: Resolve Python version
        id: python
        env:
          PYTHON_VERSION_INPUT: ${{ inputs.python_version }}
        run: |
          FILE_VERSION=""
          if [ -f ".python-version" ]; then
            FILE_VERSION="$(head -n1 .python-version | tr -d '[:space:]')"
          fi
          if [ -n "$PYTHON_VERSION_INPUT" ]; then
            VERSION="$PYTHON_VERSION_INPUT"
          elif [ -n "$FILE_VERSION" ]; then
            VERSION="$FILE_VERSION"
          else
            VERSION="3.11"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ steps.python.outputs.version }}

      - name: Build and Publish Collection
        uses: artis3n/ansible_galaxy_collection@ffbca2460a5a1c600b941bbf1536bd61de1c2227 # v3
        with:
          api_key: ${{ secrets.galaxy_api_key }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          body_path: /tmp/changelog.txt
          draft: false
          prerelease: false
