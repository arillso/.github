---
name: CI - Go Action

on:
  workflow_call:
    inputs:
      go_version:
        description: 'Go version (or "file" to read from go.mod)'
        required: false
        type: string
        default: 'file'
      enable_golangci_lint:
        description: 'Enable golangci-lint'
        required: false
        type: boolean
        default: true
      enable_actionlint:
        description: 'Enable actionlint'
        required: false
        type: boolean
        default: true
      enable_shellcheck:
        description: 'Enable shellcheck'
        required: false
        type: boolean
        default: false
      enable_yamllint:
        description: 'Enable yamllint'
        required: false
        type: boolean
        default: true
      yamllint_config:
        description: 'Path to yamllint config file'
        required: false
        type: string
        default: '.yamllint.yml'
      yamllint_strict:
        description: 'Run yamllint in strict mode'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  golangci-lint:
    name: Go Lint
    runs-on: ubuntu-latest
    if: ${{ inputs.enable_golangci_lint }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Go (from file)
        if: ${{ inputs.go_version == 'file' }}
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Go (specific version)
        if: ${{ inputs.go_version != 'file' }}
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6
        with:
          go-version: ${{ inputs.go_version }}
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9
        with:
          version: latest

  actionlint:
    name: Action Lint
    runs-on: ubuntu-latest
    if: ${{ inputs.enable_actionlint }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Run actionlint
        uses: reviewdog/action-actionlint@0d952c597ef8459f634d7145b0b044a9699e5e43 # v1
        with:
          reporter: github-pr-review
          fail_level: error

  shellcheck:
    name: Shell Check
    runs-on: ubuntu-latest
    if: ${{ inputs.enable_shellcheck }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Run shellcheck
        uses: reviewdog/action-shellcheck@4c07458293ac342d477251099501a718ae5ef86e # v1
        with:
          reporter: github-pr-review
          fail_level: error

  yamllint:
    name: YAML Lint
    runs-on: ubuntu-latest
    if: ${{ inputs.enable_yamllint }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install yamllint
        run: pip install yamllint

      - name: Run yamllint
        run: |
          ARGS=""
          if [ "${{ inputs.yamllint_strict }}" == "true" ]; then
            ARGS="--strict"
          fi
          yamllint -c ${{ inputs.yamllint_config }} $ARGS .
