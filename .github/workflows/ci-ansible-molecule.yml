---
name: CI - Ansible Molecule

# Molecule test runner for Ansible collections that ship scenarios under
# `extensions/molecule/<scenario>/`. The job checks the collection out
# under `ansible_collections/<namespace>/<name>` so the collection's own
# FQCN resolves during molecule converge/verify, then runs one scenario
# per matrix entry.
#
# Scenario discovery:
# - If `scenarios` (JSON array) is provided, that list is used verbatim.
# - Otherwise the workflow lists `scenarios_root` and skips any directory
#   whose name begins with `.` (e.g. `.config`).
#
# Driver (input `driver`):
# - `docker` (default): containers from geerlingguy/docker-*-ansible. Roles
#   that touch the kernel (sysctl write, nftables load, swap, ethtool) should
#   ship a `test_sequence:` stopping at `syntax` in their molecule.yml —
#   running them under docker is otherwise unreliable.
# - `qemu`: boots full VMs via the molecule-qemu driver for roles that need a
#   real kernel and init system (k3s, container engines, systemd services).
#   GitHub-hosted ubuntu-latest exposes a writable /dev/kvm, so molecule-qemu
#   auto-detects hardware acceleration (falls back to TCG otherwise). The job
#   installs QEMU, adds the runner user to the kvm group, and runs molecule
#   via `sg kvm` (group changes do not affect the current shell). Each role's
#   molecule.yml selects `driver: molecule-qemu` and defines its platforms.

on:
  workflow_call:
    inputs:
      collection_namespace:
        type: string
        required: false
        default: 'arillso'
        description: 'Collection namespace (the part before the dot in `<ns>.<name>`).'
      collection_name:
        type: string
        required: true
        description: 'Collection name.'
      driver:
        type: string
        required: false
        default: 'docker'
        description: |
          Molecule driver: `docker` (default, fast containers) or `qemu`
          (full VMs via molecule-qemu, for roles needing a real kernel/init).
      python_version:
        type: string
        required: false
        default: '3.12'
        description: 'Python version to use for pip and the molecule run.'
      scenarios:
        type: string
        required: false
        default: ''
        description: |
          JSON array of scenario directory names under `scenarios_root`.
          When empty, the workflow discovers scenarios automatically and
          builds the matrix from the directory listing (entries starting
          with `.` are skipped).
      scenarios_root:
        type: string
        required: false
        default: 'extensions/molecule'
        description: |
          Path (relative to the collection root) where scenarios live.
          Defaults to the layout shipped inside published collection
          tarballs; override for repos that keep scenarios elsewhere.
      runs_on:
        type: string
        required: false
        default: 'ubuntu-latest'
        description: |
          GitHub-hosted runner label for the molecule matrix legs. The
          standard ubuntu-latest runner exposes /dev/kvm, so the `qemu`
          driver does not require a larger/paid runner.
      cancel-in-progress:
        type: boolean
        required: false
        default: true
        description: |
          Whether to cancel in-progress runs in the same concurrency group.
          Default matches this workflow's intended semantics; override only
          for matrix or fan-out invocations that need different semantics
          than the single-call default.
      concurrency-suffix:
        type: string
        required: false
        default: ''
        description: |
          Optional suffix appended to the concurrency group as `-<suffix>`.
          Empty default preserves the original group name; set to separate
          parallel invocations of this reusable from the same caller (e.g.
          per-matrix-leg or per-mode).

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref }}${{
      inputs.concurrency-suffix != '' && format('-{0}', inputs.concurrency-suffix) || ''
    }}
  cancel-in-progress: ${{ inputs.cancel-in-progress }}

jobs:
  discover:
    name: Discover scenarios
    runs-on: ${{ inputs.runs_on }}
    outputs:
      scenarios: ${{ steps.list.outputs.scenarios }}
    steps:
      - name: Validate driver input
        env:
          DRIVER: ${{ inputs.driver }}
        run: |
          set -euo pipefail
          case "$DRIVER" in
            docker|qemu) ;;
            *) echo "::error::Invalid driver '$DRIVER' (expected 'docker' or 'qemu')"; exit 1 ;;
          esac

      - name: Checkout collection
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Build scenario matrix
        id: list
        env:
          INPUT_SCENARIOS: ${{ inputs.scenarios }}
          SCENARIOS_ROOT: ${{ inputs.scenarios_root }}
        run: |
          set -euo pipefail

          if [ -n "$INPUT_SCENARIOS" ]; then
            # Trust caller's list verbatim; validates by round-tripping through jq.
            echo "scenarios=$(echo "$INPUT_SCENARIOS" | jq -c '.')" >> "$GITHUB_OUTPUT"
            echo "::notice::Using caller-supplied scenarios: $INPUT_SCENARIOS"
            exit 0
          fi

          if [ ! -d "$SCENARIOS_ROOT" ]; then
            echo "::error::Scenarios root '$SCENARIOS_ROOT' does not exist"
            exit 1
          fi

          # Auto-discover: each subdirectory of SCENARIOS_ROOT not starting
          # with '.' is treated as a scenario. The `.config` convention
          # (shared molecule helpers) is skipped this way.
          mapfile -t scenarios < <(
            find "$SCENARIOS_ROOT" -mindepth 1 -maxdepth 1 -type d \
              -not -name '.*' -printf '%f\n' | sort
          )

          if [ ${#scenarios[@]} -eq 0 ]; then
            echo "::error::No scenarios discovered under $SCENARIOS_ROOT"
            exit 1
          fi

          MATRIX=$(printf '%s\n' "${scenarios[@]}" | jq -R . | jq -sc .)
          echo "scenarios=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "::notice::Discovered scenarios: $MATRIX"

  molecule:
    name: Molecule (${{ matrix.scenario }})
    needs: discover
    runs-on: ${{ inputs.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJson(needs.discover.outputs.scenarios) }}
    steps:
      - name: Checkout collection into ansible_collections/<ns>/<name>
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          path: ansible_collections/${{ inputs.collection_namespace }}/${{ inputs.collection_name }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ inputs.python_version }}
          cache: 'pip'
          cache-dependency-path: ansible_collections/${{ inputs.collection_namespace }}/${{ inputs.collection_name }}/requirements.txt

      - name: Install QEMU/KVM and enable /dev/kvm access
        if: inputs.driver == 'qemu'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          # genisoimage provides mkisofs (cloud-init seed ISO); qemu-system-x86
          # + qemu-utils are the molecule-qemu runtime dependencies.
          sudo apt-get install -y -qq \
            qemu-system-x86 qemu-utils genisoimage
          # The runner user is not in the kvm group by default; add it. Log
          # whether acceleration is available without failing the step
          # (molecule-qemu falls back to TCG when /dev/kvm is absent).
          sudo usermod -aG kvm "$USER"
          if [ -e /dev/kvm ]; then
            ls -l /dev/kvm
          else
            echo "::warning::/dev/kvm absent — molecule-qemu will fall back to TCG"
          fi

      - name: Install collection dev dependencies
        working-directory: ansible_collections/${{ inputs.collection_namespace }}/${{ inputs.collection_name }}
        run: |
          if [ ! -f requirements.txt ]; then
            echo "::error::requirements.txt missing; cannot install molecule + driver"
            exit 1
          fi
          pip install -r requirements.txt

      - name: Install collection runtime dependencies
        working-directory: ansible_collections/${{ inputs.collection_namespace }}/${{ inputs.collection_name }}
        env:
          SCENARIOS_ROOT: ${{ inputs.scenarios_root }}
        run: |
          req="${SCENARIOS_ROOT}/.config/requirements.yml"
          if [ -f "$req" ]; then
            ansible-galaxy collection install -r "$req"
          else
            echo "::notice::No shared collection requirements at $req — skipping"
          fi

      - name: Run molecule scenario
        working-directory: ansible_collections/${{ inputs.collection_namespace }}/${{ inputs.collection_name }}
        env:
          ANSIBLE_FORCE_COLOR: '1'
          PY_COLORS: '1'
          MOLECULE_NO_LOG: 'false'
          DRIVER: ${{ inputs.driver }}
          SCENARIO: ${{ matrix.scenario }}
          SCENARIOS_ROOT: ${{ inputs.scenarios_root }}
        run: |
          # Molecule resolves scenarios relative to the cwd that contains
          # `molecule/`. SCENARIOS_ROOT is the parent of that directory
          # (e.g. `extensions/molecule` -> cd `extensions/`).
          cd "$(dirname "$SCENARIOS_ROOT")"
          if [ "$DRIVER" = "qemu" ]; then
            # `sg kvm` activates the freshly added group membership for this command.
            sg kvm -c "molecule test -s '$SCENARIO'"
          else
            molecule test -s "$SCENARIO"
          fi

      - name: Summarise scenario outcome
        if: always()
        env:
          DRIVER: ${{ inputs.driver }}
          SCENARIO: ${{ matrix.scenario }}
          STATUS: ${{ job.status }}
        run: |
          {
            echo "## Molecule scenario (${DRIVER}): \`$SCENARIO\`"
            echo
            echo "**Status:** $STATUS"
          } >> "$GITHUB_STEP_SUMMARY"
