---
name: Security - Trivy Scan

on:
  workflow_call:
    inputs:
      scan_type:
        description: 'Scan type: fs (filesystem) or image (container image)'
        required: false
        type: string
        default: 'fs'
      scan_ref:
        description: 'Path to scan (for fs) or image name (for image)'
        required: false
        type: string
        default: '.'
      trivy_config:
        description: 'Path to Trivy config file'
        required: false
        type: string
        default: ''
      severity:
        description: 'Severities to scan for (UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL)'
        required: false
        type: string
        default: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'
      skip_dirs:
        description: 'Comma-separated list of directories to skip'
        required: false
        type: string
        default: ''
      enable_secret_scan:
        description: 'Enable secret scanning with TruffleHog'
        required: false
        type: boolean
        default: false
      build_docker_image:
        description: 'Build Docker image before scanning (for image scans)'
        required: false
        type: boolean
        default: false
      dockerfile_path:
        description: 'Path to Dockerfile (if build_docker_image is true)'
        required: false
        type: string
        default: 'Dockerfile'
      image_name:
        description: 'Image name to build (if build_docker_image is true)'
        required: false
        type: string
        default: 'trivy-scan-image'

permissions:
  contents: read
  security-events: write

jobs:
  build-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    if: ${{ inputs.build_docker_image && inputs.scan_type == 'image' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@70df71c7e8c6420d39be3c8a8c2e90e9ad4ef59d # v3

      - name: Build Docker image
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6
        with:
          context: .
          file: ${{ inputs.dockerfile_path }}
          tags: ${{ inputs.image_name }}:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trivy-scan:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [build-image]
    if: ${{ always() && !cancelled() }}
    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Set up Docker Buildx (if image scan with build)
        if: ${{ inputs.build_docker_image && inputs.scan_type == 'image' }}
        uses: docker/setup-buildx-action@70df71c7e8c6420d39be3c8a8c2e90e9ad4ef59d # v3

      - name: Build Docker image (if needed)
        if: ${{ inputs.build_docker_image && inputs.scan_type == 'image' }}
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6
        with:
          context: .
          file: ${{ inputs.dockerfile_path }}
          tags: ${{ inputs.image_name }}:latest
          load: true
          cache-from: type=gha

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # 0.33.1
        with:
          scan-type: ${{ inputs.scan_type }}
          scan-ref: ${{ inputs.build_docker_image && inputs.scan_type == 'image' && format('{0}:latest', inputs.image_name) || inputs.scan_ref }}
          format: sarif
          output: trivy-results.sarif
          severity: ${{ inputs.severity }}
          skip-dirs: ${{ inputs.skip_dirs }}
          trivy-config: ${{ inputs.trivy_config }}

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@5d4e8d1aca955e8d8589aabd499c5cae939e33c7 # v4
        with:
          sarif_file: trivy-results.sarif

  secret-scan:
    name: Secret Scan (TruffleHog)
    runs-on: ubuntu-latest
    if: ${{ inputs.enable_secret_scan }}
    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@d6e0bb574be7ace57ce06dcb8f81a73a60e1de78 # v3.87.2
        with:
          extra_args: --only-verified
