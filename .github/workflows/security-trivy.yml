---
name: Security - Trivy Scan

on:
  workflow_call:
    inputs:
      scan_type:
        description: 'Scan type: fs (filesystem) or image (container image)'
        required: false
        type: string
        default: 'fs'
      scan_ref:
        description: 'Path to scan (for fs) or image name (for image)'
        required: false
        type: string
        default: '.'
      trivy_config:
        description: 'Path to Trivy config file'
        required: false
        type: string
        default: ''
      severity:
        description: 'Severities to scan for (UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL)'
        required: false
        type: string
        default: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'
      skip_dirs:
        description: 'Comma-separated list of directories to skip'
        required: false
        type: string
        default: ''
      enable_secret_scan:
        description: 'Enable secret scanning with TruffleHog'
        required: false
        type: boolean
        default: false
      build_docker_image:
        description: 'Build Docker image before scanning (for image scans)'
        required: false
        type: boolean
        default: false
      dockerfile_path:
        description: 'Path to Dockerfile (if build_docker_image is true)'
        required: false
        type: string
        default: 'Dockerfile'
      image_name:
        description: 'Image name to build (if build_docker_image is true)'
        required: false
        type: string
        default: 'trivy-scan-image'

permissions:
  contents: read
  security-events: write

jobs:
  build-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ inputs.build_docker_image && inputs.scan_type == 'image' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ inputs.dockerfile_path }}
          tags: ${{ inputs.image_name }}:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trivy-scan:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-image]
    if: ${{ always() && !cancelled() }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx (if image scan with build)
        if: ${{ inputs.build_docker_image && inputs.scan_type == 'image' }}
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build Docker image (if needed)
        if: ${{ inputs.build_docker_image && inputs.scan_type == 'image' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ inputs.dockerfile_path }}
          tags: ${{ inputs.image_name }}:latest
          load: true
          cache-from: type=gha

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: ${{ inputs.scan_type }}
          scan-ref: ${{ inputs.build_docker_image && inputs.scan_type == 'image' && format('{0}:latest', inputs.image_name) || inputs.scan_ref }}
          format: sarif
          output: trivy-results.sarif
          severity: ${{ inputs.severity }}
          skip-dirs: ${{ inputs.skip_dirs }}
          trivy-config: ${{ inputs.trivy_config }}

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          sarif_file: trivy-results.sarif

  secret-scan:
    name: Secret Scan (TruffleHog)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ inputs.enable_secret_scan }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@f714bf454f350590f4a24c3ddb1aef02c35bf5b6 # v3.97.5
        with:
          extra_args: --only-verified
