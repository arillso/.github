---
name: Security - Trivy Scan

on:
  workflow_call:
    inputs:
      scan_type:
        description: 'Scan type: fs (filesystem) or image (container image)'
        required: false
        type: string
        default: 'fs'
      scan_ref:
        description: 'Path to scan (for fs) or image name (for image)'
        required: false
        type: string
        default: '.'
      trivy_config:
        description: 'Path to Trivy config file'
        required: false
        type: string
        default: ''
      severity:
        description: 'Severities to scan for (UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL)'
        required: false
        type: string
        default: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'
      skip_dirs:
        description: 'Comma-separated list of directories to skip'
        required: false
        type: string
        default: ''
      enable_secret_scan:
        description: 'Enable secret scanning with TruffleHog'
        required: false
        type: boolean
        default: false
      build_docker_image:
        description: 'Build Docker image before scanning (for image scans)'
        required: false
        type: boolean
        default: false
      dockerfile_path:
        description: 'Path to Dockerfile (if build_docker_image is true)'
        required: false
        type: string
        default: 'Dockerfile'
      image_name:
        description: 'Image name to build (if build_docker_image is true)'
        required: false
        type: string
        default: 'trivy-scan-image'

permissions:
  contents: read
  security-events: write

jobs:
  build-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    if: ${{ inputs.build_docker_image && inputs.scan_type == 'image' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Build Docker image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: ${{ inputs.dockerfile_path }}
          tags: ${{ inputs.image_name }}:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trivy-scan:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [build-image]
    if: ${{ always() && !cancelled() }}
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Docker Buildx (if image scan with build)
        if: ${{ inputs.build_docker_image && inputs.scan_type == 'image' }}
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Build Docker image (if needed)
        if: ${{ inputs.build_docker_image && inputs.scan_type == 'image' }}
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: ${{ inputs.dockerfile_path }}
          tags: ${{ inputs.image_name }}:latest
          load: true
          cache-from: type=gha

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: ${{ inputs.scan_type }}
          scan-ref: ${{ inputs.build_docker_image && inputs.scan_type == 'image' && format('{0}:latest', inputs.image_name) || inputs.scan_ref }}
          format: sarif
          output: trivy-results.sarif
          severity: ${{ inputs.severity }}
          skip-dirs: ${{ inputs.skip_dirs }}
          trivy-config: ${{ inputs.trivy_config }}

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          sarif_file: trivy-results.sarif

  secret-scan:
    name: Secret Scan (TruffleHog)
    runs-on: ubuntu-latest
    if: ${{ inputs.enable_secret_scan }}
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@30d5bb91af1a771378349dbbb0c82129392acf70 # v3.95.6
        with:
          extra_args: --only-verified
