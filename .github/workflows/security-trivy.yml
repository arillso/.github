---
name: Security - Trivy Scan

on:
  workflow_call:
    inputs:
      scan_type:
        description: 'Scan type: fs (filesystem) or image (container image)'
        required: false
        type: string
        default: 'fs'
      scan_ref:
        description: 'Path to scan (for fs) or image name (for image)'
        required: false
        type: string
        default: '.'
      trivy_config:
        description: 'Path to Trivy config file'
        required: false
        type: string
        default: ''
      severity:
        description: 'Severities to scan for (UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL)'
        required: false
        type: string
        default: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'
      skip_dirs:
        description: 'Comma-separated list of directories to skip'
        required: false
        type: string
        default: ''
      enable_secret_scan:
        description: 'Enable secret scanning with TruffleHog'
        required: false
        type: boolean
        default: false
      build_docker_image:
        description: 'Build Docker image before scanning (for image scans)'
        required: false
        type: boolean
        default: false
      dockerfile_path:
        description: 'Path to Dockerfile (if build_docker_image is true)'
        required: false
        type: string
        default: 'Dockerfile'
      image_name:
        description: 'Image name to build (if build_docker_image is true)'
        required: false
        type: string
        default: 'trivy-scan-image'

permissions:
  contents: read
  security-events: write

jobs:
  build-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    if: ${{ inputs.build_docker_image && inputs.scan_type == 'image' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Build Docker image
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7
        with:
          context: .
          file: ${{ inputs.dockerfile_path }}
          tags: ${{ inputs.image_name }}:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trivy-scan:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [build-image]
    if: ${{ always() && !cancelled() }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Docker Buildx (if image scan with build)
        if: ${{ inputs.build_docker_image && inputs.scan_type == 'image' }}
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Build Docker image (if needed)
        if: ${{ inputs.build_docker_image && inputs.scan_type == 'image' }}
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7
        with:
          context: .
          file: ${{ inputs.dockerfile_path }}
          tags: ${{ inputs.image_name }}:latest
          load: true
          cache-from: type=gha

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: ${{ inputs.scan_type }}
          scan-ref: ${{ inputs.build_docker_image && inputs.scan_type == 'image' && format('{0}:latest', inputs.image_name) || inputs.scan_ref }}
          format: sarif
          output: trivy-results.sarif
          severity: ${{ inputs.severity }}
          skip-dirs: ${{ inputs.skip_dirs }}
          trivy-config: ${{ inputs.trivy_config }}

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@38697555549f1db7851b81482ff19f1fa5c4fedc # v4
        with:
          sarif_file: trivy-results.sarif

  secret-scan:
    name: Secret Scan (TruffleHog)
    runs-on: ubuntu-latest
    if: ${{ inputs.enable_secret_scan }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@6c64db94d5b2e09d7e0948fb6bd3166cc6fffbc7 # v3.94.0
        with:
          extra_args: --only-verified
