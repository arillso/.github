---
name: Security - Secrets

on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        default: '.'
        description: 'Working directory for scans'
      enable-gitleaks:
        type: boolean
        default: true
        description: 'Enable Gitleaks secret scanning'
      enable-trufflehog:
        type: boolean
        default: true
        description: 'Enable TruffleHog git history scanning'
      enable-pattern-detection:
        type: boolean
        default: true
        description: 'Enable custom pattern detection'
      cancel-in-progress:
        type: boolean
        required: false
        default: true
        description: |
          Whether to cancel in-progress runs in the same concurrency group.
          Default matches this workflow's intended semantics; override only
          for matrix or fan-out invocations that need different semantics
          than the single-call default.
      concurrency-suffix:
        type: string
        required: false
        default: ''
        description: |
          Optional suffix appended to the concurrency group as `-<suffix>`.
          Empty default preserves the original group name; set to separate
          parallel invocations of this reusable from the same caller (e.g.
          per-matrix-leg or per-mode).

permissions:
  contents: read
  actions: read

concurrency:
  # Static `security-secrets-` discriminator: inside a `workflow_call` reusable
  # `github.workflow`/`github.ref` resolve to the *caller*, so without it two
  # different reusables invoked from the same caller (e.g. ci-go + this) would
  # share a group and cancel each other. `concurrency-suffix` further separates
  # parallel invocations of this same reusable.
  group: >-
    security-secrets-${{ github.workflow }}-${{ github.ref }}${{
      inputs.concurrency-suffix != '' && format('-{0}', inputs.concurrency-suffix) || ''
    }}
  cancel-in-progress: ${{ inputs.cancel-in-progress }}

jobs:
  gitleaks:
    name: Scan with Gitleaks
    if: inputs.enable-gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Gitleaks
        uses: jaxxstorm/action-install-gh-release@25e24d2d23ae098373794ef1d6faecb48ee52da8 # v3.0.0
        with:
          repo: gitleaks/gitleaks
          tag: v8.30.1

      - name: Run Gitleaks
        working-directory: ${{ inputs.working-directory }}
        run: gitleaks detect --source . --verbose

  trufflehog:
    name: Scan with TruffleHog
    if: inputs.enable-trufflehog
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          path: ${{ inputs.working-directory }}
          base: ${{ github.event.before || 'HEAD~1' }}
          head: HEAD
          # `lob` is excluded because it reports plain source code as verified
          # credentials. Its pattern is `(live|test)_[a-zA-Z0-9_]{35}` with no
          # entropy check, so any 40-character identifier starting with `test_`
          # matches — which every descriptive pytest function name eventually
          # does. Verification then POSTs an empty body and counts the 422 that
          # comes back as proof the credential is live, so `--only-verified`
          # does not filter these out. Upstream:
          # https://github.com/trufflesecurity/trufflehog/issues/5184
          # Drop this once a release carries the fix.
          extra_args: --debug --only-verified --exclude-detectors lob

  pattern-detection:
    name: Detect Patterns
    if: inputs.enable-pattern-detection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: AWS Access Key Detection
        working-directory: ${{ inputs.working-directory }}
        run: |
          echo "Checking for AWS access key patterns..."
          if grep -r -E "AKIA[0-9A-Z]{16}" . \
            --include="*.tf" --include="*.yml" --include="*.yaml" --include="*.json"; then
            echo "::error::AWS access key pattern detected"
            exit 1
          fi
          echo "No AWS access keys found"

      - name: Private Key Detection
        working-directory: ${{ inputs.working-directory }}
        run: |
          echo "Checking for private key content..."
          if grep -r "BEGIN.*PRIVATE.*KEY" . \
            --include="*.pem" --include="*.key" --exclude-dir=".git"; then
            echo "::error::Private key content detected"
            exit 1
          fi
          echo "No private keys found"

      - name: Generic Secret Patterns
        working-directory: ${{ inputs.working-directory }}
        run: |
          echo "Checking for generic secret patterns..."
          FOUND_ISSUES=0

          echo "Checking for hardcoded passwords..."
          if grep -r "password:" . \
            --include="*.yaml" --include="*.yml" \
            | grep -v "secretKeyRef\|valueFrom\|ExternalSecret\|# Example\|# Template"; then
            echo "::warning::Potential hardcoded passwords found"
            FOUND_ISSUES=$((FOUND_ISSUES + 1))
          fi

          echo "Checking for hardcoded API keys..."
          if grep -r "apiKey:\|api_key:" . \
            --include="*.yaml" --include="*.yml" \
            | grep -v "secretKeyRef\|valueFrom\|ExternalSecret\|# Example\|# Template"; then
            echo "::warning::Potential hardcoded API keys found"
            FOUND_ISSUES=$((FOUND_ISSUES + 1))
          fi

          echo "Checking for hardcoded tokens..."
          if grep -r "token:" . \
            --include="*.yaml" --include="*.yml" \
            | grep -v "secretKeyRef\|valueFrom\|ExternalSecret\|# Example\|# Template\|access_token\|description"; then
            echo "::warning::Potential hardcoded tokens found"
            FOUND_ISSUES=$((FOUND_ISSUES + 1))
          fi

          if [ $FOUND_ISSUES -eq 0 ]; then
            echo "No hardcoded secrets detected"
          else
            echo ""
            echo "Found $FOUND_ISSUES potential issues"
            echo "Please verify these are using secure secret management"
          fi

  security-report:
    name: Create Report
    runs-on: ubuntu-latest
    needs: [gitleaks, trufflehog, pattern-detection]
    if: always() && !cancelled()
    steps:
      - name: Generate Security Report
        env:
          GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
          TRUFFLEHOG_RESULT: ${{ needs.trufflehog.result }}
          PATTERN_RESULT: ${{ needs.pattern-detection.result }}
        run: |
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          {
            printf '# Secret Detection Report\n\n'
            printf '**Timestamp:** %s\n\n' "$TIMESTAMP"
            printf '## Scan Results\n\n'
            printf '| Scanner | Status |\n'
            printf '|---------|--------|\n'
            printf '| Gitleaks | %s |\n' "$GITLEAKS_RESULT"
            printf '| TruffleHog | %s |\n' "$TRUFFLEHOG_RESULT"
            printf '| Pattern Detection | %s |\n\n' "$PATTERN_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"
          cat >> "$GITHUB_STEP_SUMMARY" << 'EOF'
          ## Tools Used

          - **Gitleaks**: Fast secret detection in code
          - **TruffleHog**: Git history secret scanning (verified secrets only)
          - **Pattern Detection**: Custom regex patterns for secrets

          ## Security Best Practices

          - Use environment variables for sensitive data
          - Never commit .env files or credentials
          - Rotate secrets if accidentally committed
          - Use GitHub Secrets for CI/CD pipelines

          ---
          *Secret detection completed*
          EOF
