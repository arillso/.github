---
name: CI - Lint

on:
  workflow_call:
    inputs:
      enable_actionlint:
        description: 'Enable actionlint'
        required: false
        type: boolean
        default: true
      enable_shellcheck:
        description: 'Enable shellcheck'
        required: false
        type: boolean
        default: false
      enable_yamllint:
        description: 'Enable yamllint'
        required: false
        type: boolean
        default: true
      yamllint_config:
        description: 'Path to yamllint config file'
        required: false
        type: string
        default: '.yamllint.yml'
      yamllint_strict:
        description: 'Run yamllint in strict mode'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  actionlint:
    name: Action Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ inputs.enable_actionlint }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run actionlint
        uses: reviewdog/action-actionlint@78b296370c5c75abca79860e9baa9846e3286a29 # v1.84.0
        with:
          reporter: github-pr-review
          fail_level: error

  shellcheck:
    name: Shell Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ inputs.enable_shellcheck }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run shellcheck
        uses: reviewdog/action-shellcheck@b4ffc0b2a69f857f82b74d1310cd3e62e932f9f7 # v1.35.0
        with:
          reporter: github-pr-review
          fail_level: error

  yamllint:
    name: YAML Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ inputs.enable_yamllint }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install yamllint
        run: pip install yamllint

      - name: Run yamllint
        env:
          YAMLLINT_STRICT: ${{ inputs.yamllint_strict }}
          YAMLLINT_CONFIG: ${{ inputs.yamllint_config }}
        run: |
          set -euo pipefail
          # Values arrive via env: and are read as shell variables, not
          # substituted into the body by the workflow parser — a caller value
          # containing $(...) stays a config path instead of becoming code.
          ARGS=()
          if [ "$YAMLLINT_STRICT" == "true" ]; then
            ARGS+=("--strict")
          fi
          yamllint -c "$YAMLLINT_CONFIG" "${ARGS[@]}" .
