---
name: CI - Lint

on:
  workflow_call:
    inputs:
      enable_actionlint:
        description: 'Enable actionlint'
        required: false
        type: boolean
        default: true
      enable_shellcheck:
        description: 'Enable shellcheck'
        required: false
        type: boolean
        default: false
      enable_yamllint:
        description: 'Enable yamllint'
        required: false
        type: boolean
        default: true
      yamllint_config:
        description: 'Path to yamllint config file'
        required: false
        type: string
        default: '.yamllint.yml'
      yamllint_strict:
        description: 'Run yamllint in strict mode'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  actionlint:
    name: Action Lint
    runs-on: ubuntu-latest
    if: ${{ inputs.enable_actionlint }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Run actionlint
        uses: reviewdog/action-actionlint@6fb7acc99f4a1008869fa8a0f09cfca740837d9d # v1
        with:
          reporter: github-pr-review
          fail_level: error

  shellcheck:
    name: Shell Check
    runs-on: ubuntu-latest
    if: ${{ inputs.enable_shellcheck }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Run shellcheck
        uses: reviewdog/action-shellcheck@4c07458293ac342d477251099501a718ae5ef86e # v1
        with:
          reporter: github-pr-review
          fail_level: error

  yamllint:
    name: YAML Lint
    runs-on: ubuntu-latest
    if: ${{ inputs.enable_yamllint }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install yamllint
        run: pip install yamllint

      - name: Run yamllint
        run: |
          ARGS=""
          if [ "${{ inputs.yamllint_strict }}" == "true" ]; then
            ARGS="--strict"
          fi
          yamllint -c ${{ inputs.yamllint_config }} $ARGS .
