---
name: Pull Request

run-name: |
  Pull Request by @${{ github.actor }}

"on":
  # Only `main` on push (post-merge CI). Do NOT add `feature/**` here: a PR
  # opened from a feature branch would then run every job twice (once for
  # `push`, once for `pull_request`), and the per-`github.ref` concurrency
  # group does not deduplicate them.
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - ".github/CODEOWNERS"
  # NOTE: with `paths-ignore`, a PR touching only these paths runs no jobs.
  # If you mark `go`/`lint`/`codeql` as required status checks in branch
  # protection, such a PR can never satisfy them — drop `paths-ignore` or add
  # a skip job if you need that.
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - ".github/CODEOWNERS"
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    uses: arillso/.github/.github/workflows/ci-go.yml@main

  lint:
    name: Lint
    uses: arillso/.github/.github/workflows/ci-lint.yml@main
    with:
      enable_shellcheck: true

  codeql:
    name: Code Analysis
    permissions:
      contents: read
      security-events: write
    uses: arillso/.github/.github/workflows/security-code.yml@main
    with:
      languages: '["go"]'

  review:
    name: Code Review
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    uses: arillso/.github/.github/workflows/ai-claude-review.yml@main
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
