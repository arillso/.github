---
name: Pull Request

run-name: |
  Pull Request by @${{ github.actor }}

"on":
  push:
    branches:
      - main
      - "feature/**"
    paths-ignore:
      - "**.md"
      - ".github/CODEOWNERS"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - ".github/CODEOWNERS"
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    uses: arillso/.github/.github/workflows/ci-go.yml@main

  lint:
    name: Lint
    uses: arillso/.github/.github/workflows/ci-lint.yml@main
    with:
      enable_shellcheck: true

  codeql:
    name: Code Analysis
    permissions:
      contents: read
      security-events: write
    uses: arillso/.github/.github/workflows/security-code.yml@main
    with:
      languages: '["go"]'

  review:
    name: Code Review
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    uses: arillso/.github/.github/workflows/ai-claude-review.yml@main
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
