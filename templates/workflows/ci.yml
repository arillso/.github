---
name: CI

"on":
  push:
    branches:
      - main
      - "feature/**"
    paths-ignore:
      - "**.md"
      - ".github/CODEOWNERS"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - ".github/CODEOWNERS"
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  ci:
    uses: arillso/.github/.github/workflows/ci-go-action.yml@main
    with:
      enable_shellcheck: true
